{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Вхід</title>
    <link rel="stylesheet" href="{% static 'tasks/auth.css' %}">
</head>
<body>
    <div class="auth-card">
        <h2>Вхід у систему</h2>
        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: #f44336; font-size: 0.85em; margin-top: 5px;">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Увійти</button>
        </form>

        <div class="auth-links">
            <p>Ще немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
        </div>
    </div>
</body>
</html>
