services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: cgr.dev/chainguard/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio ${AWS_S3_ENDPOINT_URL} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${AWS_STORAGE_BUCKET_NAME};
      mc anonymous set public myminio/${AWS_STORAGE_BUCKET_NAME};
      exit 0;
      "
  web1:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      - SERVER_NAME=Server-1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - minio
    restart: always

  web2:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - SERVER_NAME=Server-2
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
    depends_on:
      - web1
      - web2
      - minio
    restart: always

volumes:
  postgres_data:
  static_volume:
  minio_data: