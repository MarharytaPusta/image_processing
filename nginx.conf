events {}

http {
    include /etc/nginx/mime.types;

    upstream django_cluster {
        least_conn;
        server web1:8000;
        server web2:8000;
    }

    server {
        listen 80;

        error_page 502 503 504 /server_busy;

        location = /server_busy {
            default_type text/plain;
            charset utf-8;
            return 503 "Сервіс тимчасово перевантажений. Будь ласка, зачекайте хвилинку і оновіть сторінку.";
        }

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://django_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}