events {}

http {
    include /etc/nginx/mime.types;

    limit_req_zone $binary_remote_addr zone=req_limit_zone:1m rate=5r/s;

    upstream django_cluster {
        least_conn;
        server web1:8000;
        server web2:8000;
    }

    server {
        listen 80;

        error_page 502 503 504 /server_busy;

        location = /server_busy {
            default_type text/plain;
            charset utf-8;
            return 503 "Сервіс тимчасово перевантажений. Будь ласка, зачекайте хвилину і оновіть сторінку.";
        }

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            rewrite ^/media/(.*)$ /django-media/$1 break;

            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
        }

        location / {
            limit_req zone=req_limit_zone burst=10 nodelay;

            proxy_pass http://django_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}